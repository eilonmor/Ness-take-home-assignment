[pytest]
testpaths = tests
# Every run writes three reports under reports/:
#   allure-results/  raw Allure data (open with: allure serve reports/allure-results)
#   junit.xml        JUnit XML for CI dashboards
#   report.html      standalone HTML report (no extra tools needed to open it), themed by assets/html_report.css
addopts =
    --alluredir=reports/allure-results --clean-alluredir
    --junitxml=reports/junit.xml
    --html=reports/report.html --self-contained-html --css=assets/html_report.css
junit_suite_name = ness-ebay-e2e
markers =
    smoke: quick sanity checks that the environment works
    e2e: end-to-end scenarios against the live site
    login: sign-in form behavior against live eBay (wrong password, unknown account, ...)
